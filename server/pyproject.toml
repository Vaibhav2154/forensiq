[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=4.3.0",
    "fastapi[all]>=0.116.1",
    "motor>=3.7.1",
    "pydantic>=2.0",
    "passlib>=1.7.4",
    "python-dotenv>=1.1.1",
    "python-jose>=3.5.0",
    "uvicorn>=0.35.0",
    "google-generativeai",
    "cryptography>=45.0.6",
    "schedule>=1.2.2",
    "colorama>=0.4.6",
    "pyreadline3>=3.5.4",
    "cognee",
    "fastembed",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
# Tells setuptools to look for packages in the current directory
where = ["."]
# Explicitly include your package directories
include = ["contracts*", "core*", "model*", "routers*", "services*"]

